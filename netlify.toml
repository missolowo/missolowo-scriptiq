[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm install"
[functions]
  node_bundler = "zisi"
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
[[redirects]]
  from = "/payment-success"
  to = "/index.html"
  status = 200

# Serve real files when they exist. Must sit above the catch-all
# below, or every path gets rewritten to index.html.
[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
